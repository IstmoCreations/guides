<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><title>Scramble</title>
<link rel="stylesheet" href="../kit.css">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
#root { background:#111111; color:#fff; }
.ln { position:absolute; left:120px; white-space:pre; }
#a { top:230px; font:800 168px/1 var(--sans); letter-spacing:-0.04em; }
#b { top:420px; font:400 200px/1 var(--serif); font-style:italic; color:var(--orange); }
.ln span.x { color:#6e6e6e; }
.meta { position:absolute; font:600 15px var(--sans); letter-spacing:.14em; text-transform:uppercase; color:#8a8a8a; }
.fonts { position:absolute; left:124px; top:700px; display:flex; gap:14px; }
.fonts i { font-style:normal; padding:10px 18px; border-radius:999px; border:2px solid #3a3a3a; font:600 24px var(--sans); color:#cfcfcf; }
</style></head>
<body><div id="root" data-composition-id="scramble" data-start="0" data-width="1200" data-height="900" data-duration="3">
  <div class="meta" style="left:48px;top:40px" data-layout-ignore>Headline · decoding</div>
  <div class="ln" id="a"></div>
  <div class="ln" id="b"></div>
  <div class="fonts" id="fonts"><i>Public Sans 800</i><i>Source Serif 4 Italic</i></div>
</div>
<script>
// Easing words (kit vocabulary): ease out = power2.out · glide = power2.inOut · lands = back.out(2)
// Scramble without Math.random: a hash of (line, letter, step) picks each glyph, and every step is a tl.set,
// so any frame renders identically on any seek. Resolved letters keep their place; only the tail changes.
const GLYPHS = "#%&*+=/<>?!$@";
const hash = (a, b, c) => { let h = (a * 374761393 + b * 668265263 + c * 2246822519) >>> 0; h = Math.imul(h ^ (h >>> 13), 1274126177) >>> 0; return (h ^ (h >>> 16)) >>> 0; };
const STEP = 1 / 20;
function line(sel, id, text, start, per) {
  const html = (step, t) => text.split("").map((ch, i) => {
    if (ch === " ") return " ";
    return t >= start + i * per ? ch : `<span class="x">${GLYPHS[hash(id, i, step) % GLYPHS.length]}</span>`;
  }).join("");
  gsap.set(sel, { innerHTML: html(0, 0) });
  const end = start + text.length * per;
  for (let s = 1, t = STEP; t <= end + STEP; s++, t += STEP) tl.set(sel, { innerHTML: html(s, t) }, Number(t.toFixed(3)));
}
gsap.set("#fonts", { opacity: 0, y: 12 });
const tl = gsap.timeline({ paused: true });
line("#a", 1, "Make it", 0.15, 0.09);
line("#b", 2, "obvious.", 0.55, 0.1);
tl.to("#fonts", { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 1.55)
  .to({}, { duration: 0.01 }, 2.99);
window.__timelines = window.__timelines || {};
window.__timelines["scramble"] = tl;
</script>
<script src="../kit-preview.js"></script>
</body></html>
