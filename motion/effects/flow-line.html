<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><title>Flow Line</title>
<link rel="stylesheet" href="../kit.css">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
svg { position:absolute; inset:0; }
.path { fill:none; stroke:var(--ink); stroke-width:3; stroke-linecap:round; }
/* the pen: a zero-length dash with a round cap rides the tip of the line as it draws */
.pen { fill:none; stroke:var(--orange); stroke-width:16; stroke-linecap:round; stroke-dasharray:0 2; }
.node { position:absolute; width:290px; height:150px; border-radius:22px; background:#fff; border:3px solid var(--line);
        padding:22px 26px; box-shadow:0 18px 40px -26px #00000059; }
.node b { display:block; font:400 26px var(--serif); font-style:italic; color:var(--ink-soft); }
.node h4 { margin:6px 0 0; font:800 40px var(--sans); letter-spacing:-0.02em; }
/* ACTIVE: an orange ring in the status slot; DONE: the ring gives way to a tick */
.node .act { position:absolute; right:22px; top:22px; width:40px; height:40px; border-radius:50%; border:4px solid var(--orange); }
.node .ok { position:absolute; right:22px; top:22px; width:40px; height:40px; border-radius:50%; background:var(--ink); }
.node .ok::after { content:""; position:absolute; left:14px; top:9px; width:10px; height:18px; border:solid #fff; border-width:0 4px 4px 0; transform:rotate(45deg); }
/* ripple: one ring spreading from the tick as it lands */
.node .rp { position:absolute; right:22px; top:22px; width:40px; height:40px; border-radius:50%; border:3px solid var(--orange); opacity:0; }
#n3 .rp { border-color:var(--ink); }
.live { position:absolute; left:960px; top:750px; }
.live .chip { background:var(--ink); color:#fff; font-size:22px; padding:12px 22px; }
.live .chip span { color:var(--orange); }
.ring { position:absolute; left:-10px; top:-10px; right:-10px; bottom:-10px; border-radius:999px; border:3px solid var(--orange); }
.title { position:absolute; left:90px; top:70px; font:800 52px var(--sans); letter-spacing:-0.03em; }
.meta { position:absolute; top:44px; right:48px; font:600 15px var(--sans); letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft); }
</style></head>
<body><div id="root" class="grid-paper" data-composition-id="flow-line" data-start="0" data-width="1200" data-height="900" data-duration="3">
  <div class="title">From idea to <span class="accent">live.</span></div>
  <div class="meta" data-layout-ignore>Process · 3 steps</div>
  <svg viewBox="0 0 1200 900">
    <path class="path" id="p1" pathLength="1" d="M380 300 C470 300 430 470 500 470"/>
    <path class="path" id="p2" pathLength="1" d="M790 470 C880 470 840 640 910 640"/>
    <path class="pen" id="pen1" pathLength="1" d="M380 300 C470 300 430 470 500 470"/>
    <path class="pen" id="pen2" pathLength="1" d="M790 470 C880 470 840 640 910 640"/>
  </svg>
  <div class="node" id="n1" style="left:90px;top:225px"><b>01</b><h4>Brief</h4><span class="rp"></span><span class="act"></span><span class="ok"></span></div>
  <div class="node" id="n2" style="left:500px;top:395px"><b>02</b><h4>Design</h4><span class="rp"></span><span class="act"></span><span class="ok"></span></div>
  <div class="node" id="n3" style="left:910px;top:565px;width:230px"><b>03</b><h4>Ship</h4><span class="rp"></span><span class="act"></span><span class="ok"></span></div>
  <div class="live" id="live"><span class="ring" id="ring"></span><span class="chip"><span>●</span> Live</span></div>
</div>
<script>
// Easing words (kit vocabulary): ease out = power2.out · glide = power2.inOut · lands = back.out(2)
// squash = flatten to 118 % x 82 % in 0.12 s (ease out), then spring back with back.out(3), plus a ripple ring
gsap.set(".path", { attr: { "stroke-dasharray": 1, "stroke-dashoffset": 1 } });
gsap.set(".pen", { attr: { "stroke-dashoffset": 0 }, opacity: 0 });
gsap.set(".ok, .act", { scale: 0 });
const active = (n, at) => [
  [`#${n}`, { borderColor: "#ff6a00", duration: 0.15, ease: "power2.out" }, at],
  [`#${n} .act`, { scale: 1, duration: 0.2, ease: "back.out(2)" }, at],
];
const done = (n, at) => [
  [`#${n} .act`, { scale: 0, duration: 0.12, ease: "power2.out" }, at],
  [`#${n}`, { borderColor: "#111111", duration: 0.15, ease: "power2.out" }, at],
];
const draw = (p, pen, at, dur) => [
  [p, { attr: { "stroke-dashoffset": 0 }, duration: dur, ease: "power2.inOut" }, at],
  [pen, { attr: { "stroke-dashoffset": -1 }, duration: dur, ease: "power2.inOut" }, at],
  [pen, { opacity: 1, duration: 0.05 }, at],
  [pen, { opacity: 0, duration: 0.1 }, at + dur],
];
const tl = gsap.timeline({ paused: true });
tl.from(".title, .meta", { opacity: 0, y: 14, duration: 0.3, ease: "power2.out" }, 0)
  .from(".node", { opacity: 0, y: 18, duration: 0.3, stagger: 0.08, ease: "power2.out" }, 0.1);
[
  ...active("n1", 0.35), ...done("n1", 0.6),
  ...draw("#p1", "#pen1", 0.65, 0.4),
  ...active("n2", 1.0), ...done("n2", 1.2),
  ...draw("#p2", "#pen2", 1.25, 0.4),
  ...active("n3", 1.6),
].forEach(([t, v, at]) => tl.to(t, v, at));
const squash = (el, ring, at) => tl
  .fromTo(el, { scaleX: 0, scaleY: 0 }, { scaleX: 1.18, scaleY: 0.82, duration: 0.12, ease: "power2.out" }, at)
  .to(el, { scaleX: 1, scaleY: 1, duration: 0.25, ease: "back.out(3)" }, at + 0.12)
  .fromTo(ring, { scale: 1, opacity: 0.8 }, { scale: 2.1, opacity: 0, duration: 0.5, ease: "power2.out", immediateRender: false }, at + 0.08);
squash("#n1 .ok", "#n1 .rp", 0.65);
squash("#n2 .ok", "#n2 .rp", 1.25);
// Ship finishes solid orange: number and tick re-coloured in the same beat so both stay readable on it
tl.to("#n3 .act", { scale: 0, duration: 0.12, ease: "power2.out" }, 1.8)
  .to("#n3", { backgroundColor: "#ff6a00", borderColor: "#ff6a00", duration: 0.2, ease: "power2.out" }, 1.8)
  .to("#n3 b", { color: "#111111", duration: 0.2 }, 1.8)
  .to("#n3", { scale: 1.04, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out" }, 1.8);
squash("#n3 .ok", "#n3 .rp", 1.85);
tl.from("#live", { opacity: 0, y: 10, duration: 0.25, ease: "power2.out" }, 1.95)
  .fromTo("#ring", { scale: 0.9, opacity: 0.9 }, { scale: 1.25, opacity: 0, duration: 0.7, ease: "power2.out" }, 2.1)
  .to({}, { duration: 0.01 }, 2.99);
window.__timelines = window.__timelines || {};
window.__timelines["flow-line"] = tl;
</script>
<script src="../kit-preview.js"></script>
</body></html>
