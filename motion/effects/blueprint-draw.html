<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><title>Blueprint Draw</title>
<link rel="stylesheet" href="../kit.css">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
svg { position:absolute; inset:0; }
.w { fill:none; stroke:var(--ink); stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
.d { fill:none; stroke:var(--orange); stroke-width:2; }
/* the pen: a zero-length dash with a round cap rides the tip of the line as it draws */
.pen { fill:none; stroke:var(--orange); stroke-width:14; stroke-linecap:round; stroke-dasharray:0 2; }
.dim { font:600 18px var(--sans); font-variant-numeric:tabular-nums; letter-spacing:.06em; fill:var(--ink); text-anchor:middle; }
/* the finished screen, laid over the wireframe once it is drawn */
.ui { position:absolute; left:420px; top:90px; width:360px; height:720px; border-radius:44px; overflow:hidden; background:#fff;
      padding:58px 26px 0; }
.ui .hd { display:flex; justify-content:space-between; align-items:baseline; font:800 34px var(--sans); letter-spacing:-0.02em; }
.ui .hd span { font:600 15px var(--sans); color:var(--ink-soft); }
.ui .hero { margin-top:20px; height:250px; border-radius:22px; background:var(--orange); position:relative; overflow:hidden; }
.ui .hero::after { content:""; position:absolute; width:120px; height:120px; border-radius:50%; background:#fff; left:50%; top:50%; margin:-60px 0 0 -60px; }
.ui h3 { font:800 25px/1.1 var(--sans); margin:20px 0 6px; }
.ui h3 em { font-family:var(--serif); font-weight:400; color:var(--orange-text); }
.ui p { font:400 16px/1.4 var(--sans); color:var(--ink-soft); margin:0; }
.ui .cta { position:absolute; left:26px; right:26px; bottom:92px; height:58px; border-radius:999px; background:var(--ink); color:#fff;
           font:600 18px/58px var(--sans); text-align:center; }
.ui .tabs { position:absolute; left:0; right:0; bottom:0; height:70px; border-top:1px solid var(--line); display:flex; justify-content:space-around; align-items:center; }
.ui .tabs i { width:24px; height:24px; border-radius:7px; background:var(--panel); }
.ui .tabs i:first-child { background:var(--orange); }
.note { position:absolute; left:830px; font:600 22px var(--sans); color:var(--ink); display:flex; gap:12px; align-items:baseline; }
.note b { font:400 22px var(--serif); font-style:italic; color:var(--ink-soft); }
.meta { position:absolute; top:40px; font:600 15px var(--sans); letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft); }
</style></head>
<body><div id="root" class="grid-paper" data-composition-id="blueprint-draw" data-start="0" data-width="1200" data-height="900" data-duration="3">
  <div class="meta" style="left:48px" data-layout-ignore>Wireframe · Home screen</div>
  <div class="meta" style="right:48px" data-layout-ignore>Rev 02 · Scale 1:2</div>
  <svg viewBox="0 0 1200 900">
    <rect class="w" id="outline" pathLength="1" x="420" y="90" width="360" height="720" rx="44"/>
    <line class="w in" pathLength="1" x1="560" y1="112" x2="640" y2="112"/>
    <line class="w in" pathLength="1" x1="446" y1="166" x2="600" y2="166"/>
    <rect class="w in" pathLength="1" x="446" y="200" width="308" height="250" rx="22"/>
    <line class="w in" pathLength="1" x1="446" y1="200" x2="754" y2="450"/>
    <line class="w in" pathLength="1" x1="754" y1="200" x2="446" y2="450"/>
    <line class="w in" pathLength="1" x1="446" y1="486" x2="700" y2="486"/>
    <line class="w in" pathLength="1" x1="446" y1="520" x2="740" y2="520"/>
    <line class="w in" pathLength="1" x1="446" y1="546" x2="660" y2="546"/>
    <rect class="w in" pathLength="1" x="446" y="660" width="308" height="58" rx="29"/>
    <line class="w in" pathLength="1" x1="420" y1="740" x2="780" y2="740"/>
    <!-- dimension lines: the main run draws with a pen, the end ticks fade in -->
    <path class="d dm" id="dw" pathLength="1" d="M420 856 H780"/>
    <path class="d dm" id="dh" pathLength="1" d="M372 90 V810"/>
    <path class="d tk" d="M420 846 V866 M780 846 V866 M362 90 H382 M362 810 H382"/>
    <rect class="pen" id="pen0" pathLength="1" x="420" y="90" width="360" height="720" rx="44"/>
    <path class="pen" id="pen1" pathLength="1" d="M420 856 H780"/>
    <path class="pen" id="pen2" pathLength="1" d="M372 90 V810"/>
    <text class="dim" x="600" y="890">360 PT</text>
    <text class="dim" x="300" y="456">720 PT</text>
  </svg>
  <div class="ui" id="ui">
    <div class="hd">Today <span>Mon 16</span></div>
    <div class="hero"></div>
    <h3>Make it <em>obvious.</em></h3>
    <p>One idea per screen, one action per idea.</p>
    <div class="cta">Get started</div>
    <div class="tabs"><i></i><i></i><i></i><i></i></div>
  </div>
  <div class="note" style="top:220px"><b>01</b>Layout</div>
  <div class="note" style="top:300px"><b>02</b>Type</div>
  <div class="note" style="top:380px"><b>03</b>Colour</div>
</div>
<script>
// Easing words (kit vocabulary): ease out = power2.out · glide = power2.inOut · lands = back.out(2)
// Dash tweens go through attr: a CSS strokeDashoffset tween snaps from start to end at the halfway point.
gsap.set(".w, .dm", { attr: { "stroke-dasharray": 1, "stroke-dashoffset": 1 } });
gsap.set(".pen", { attr: { "stroke-dashoffset": 0 }, opacity: 0 });
gsap.set(".tk, .dim", { opacity: 0 });
gsap.set("#ui", { opacity: 0 });
const tl = gsap.timeline({ paused: true });
const drawWithPen = (line, pen, at, dur) => tl
  .to(line, { attr: { "stroke-dashoffset": 0 }, duration: dur, ease: "power2.inOut" }, at)
  .to(pen, { attr: { "stroke-dashoffset": -1 }, duration: dur, ease: "power2.inOut" }, at)
  .to(pen, { opacity: 1, duration: 0.05 }, at)
  .to(pen, { opacity: 0, duration: 0.1 }, at + dur);
drawWithPen("#outline", "#pen0", 0.05, 0.6);
tl.to(".in", { attr: { "stroke-dashoffset": 0 }, duration: 0.4, stagger: 0.05, ease: "power2.inOut" }, 0.35);
drawWithPen("#dw", "#pen1", 0.7, 0.4);
drawWithPen("#dh", "#pen2", 0.7, 0.4);
tl.to(".tk", { opacity: 1, duration: 0.15 }, 1.05)
  .to(".dim", { opacity: 1, duration: 0.2, stagger: 0.08 }, 1.0)
  .from(".note", { opacity: 0, x: -14, duration: 0.25, stagger: 0.18, ease: "power2.out" }, 1.1)
  .to("#ui", { opacity: 1, duration: 0.35, ease: "power2.inOut" }, 1.55)
  .from("#ui .hero, #ui h3, #ui p, #ui .cta", { y: 16, duration: 0.35, stagger: 0.06, ease: "power2.out" }, 1.55)
  .to({}, { duration: 0.01 }, 2.99);
window.__timelines = window.__timelines || {};
window.__timelines["blueprint-draw"] = tl;
</script>
<script src="../kit-preview.js"></script>
</body></html>
