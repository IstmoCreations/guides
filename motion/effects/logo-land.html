<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><title>Logo Land</title>
<link rel="stylesheet" href="../kit.css">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
/* A DEMO brand's mark drops, squashes on landing, ripples out, then the wordmark rises beside it. */
#mark { position:absolute; left:210px; top:330px; width:180px; height:180px; transform-origin:50% 100%; }
#mark .c { position:absolute; inset:0; border-radius:50%; background:var(--orange); }
#mark svg { position:absolute; inset:0; }
.wv { fill:none; stroke:#fff; stroke-width:12; stroke-linecap:round; }
#shadow { position:absolute; left:220px; top:520px; width:160px; height:22px; border-radius:50%; background:#00000026; transform-origin:50% 50%; }
.rp { position:absolute; left:210px; top:330px; width:180px; height:180px; border-radius:50%; border:4px solid var(--orange); opacity:0; }
.word { position:absolute; left:440px; top:330px; overflow:hidden; padding:0 20px 14px 0; font:800 150px/1.2 var(--sans); letter-spacing:-0.05em; }
.word span { display:inline-block; }
.tag { position:absolute; left:450px; top:528px; font:600 32px var(--sans); color:var(--ink-soft); }
.tag em { font-family:var(--serif); font-weight:400; color:var(--orange-text); }
.meta { position:absolute; top:40px; left:48px; font:600 15px var(--sans); letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft); }
</style></head>
<body><div id="root" class="grid-paper" data-composition-id="logo-land" data-start="0" data-width="1200" data-height="900" data-duration="4">
  <div class="meta" data-layout-ignore>Logo · demo brand</div>
  <div id="shadow"></div>
  <i class="rp" id="rp1"></i><i class="rp" id="rp2"></i>
  <div id="mark"><div class="c"></div>
    <svg viewBox="0 0 180 180"><path class="wv" id="wv" pathLength="1" d="M38 100 C58 76 78 76 90 100 C102 124 122 124 142 100"/></svg>
  </div>
  <div class="word" id="word" data-layout-allow-overflow><span>o</span><span>l</span><span>a</span><span>&nbsp;</span><span>n</span><span>e</span><span>g</span><span>r</span><span>a</span></div>
  <div class="tag" id="tag">surf &amp; paddle · <em>Pacific coast</em></div>
</div>
<script>
// Easing words (kit vocabulary): ease out = power2.out · glide = power2.inOut · lands = back.out(2)
// squash = 125 % x 75 % on impact in 0.08 s, then back.out(3); a falling object eases IN (it speeds up).
gsap.set("#mark", { y: -520 });
gsap.set("#shadow", { scaleX: 0.3, opacity: 0 });
gsap.set("#wv", { attr: { "stroke-dasharray": 1, "stroke-dashoffset": 1 } });
gsap.set("#word span", { yPercent: 110 });
gsap.set("#tag", { opacity: 0, y: 12 });
const tl = gsap.timeline({ paused: true });
tl.to("#mark", { y: 0, duration: 0.45, ease: "power2.in" }, 0.1)
  .to("#shadow", { scaleX: 1, opacity: 1, duration: 0.45, ease: "power2.in" }, 0.1)
  .to("#mark", { scaleX: 1.25, scaleY: 0.75, duration: 0.08, ease: "power2.out" }, 0.55)
  .to("#mark", { scaleX: 1, scaleY: 1, duration: 0.35, ease: "back.out(3)" }, 0.63)
  .fromTo("#rp1", { scale: 1, opacity: 0.8 }, { scale: 1.9, opacity: 0, duration: 0.6, ease: "power2.out", immediateRender: false }, 0.56)
  .fromTo("#rp2", { scale: 1, opacity: 0.6 }, { scale: 2.5, opacity: 0, duration: 0.8, ease: "power2.out", immediateRender: false }, 0.7)
  .to("#wv", { attr: { "stroke-dashoffset": 0 }, duration: 0.45, ease: "power2.inOut" }, 0.8)
  .to("#word span", { yPercent: 0, duration: 0.45, stagger: 0.04, ease: "power2.out" }, 0.85)
  .to("#tag", { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 1.45)
  .to({}, { duration: 0.01 }, 3.99);
window.__timelines = window.__timelines || {};
window.__timelines["logo-land"] = tl;
</script>
<script src="../kit-preview.js"></script>
</body></html>
