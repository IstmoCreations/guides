<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><title>ASCII Drift</title>
<link rel="stylesheet" href="../kit.css">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
/* Jellyfish drawn in text characters, rising through dark water. When a prompt starts typing into the glass box they
   turn toward it and glow brighter. Our own take on the "ASCII creature" idea: orange + fuchsia on near-black.
   v2 (2026-11-18), the method that makes it read: PAINT FIRST, THEN CONVERT. Each frame the creatures are painted at
   full resolution on a hidden canvas (a lit translucent bell with a glowing rim, radial canals, four ring gonads, a
   scalloped margin, ruffled oral arms, fine tentacles carrying a wave from each pulse, marine snow, light shafts);
   that picture is shrunk to one pixel per cell and each cell becomes a tile + glyph by its brightness and colour
   (the ASCII Swell engine: tiles, inverted highlights, glyph set by brightness + hash, glow pass, dotted grid, a
   rare accent glyph). Pure function of timeline time: no timers, no Math.random. */
#root { background:#07080b; color:#fff; }
canvas { position:absolute; inset:0; }
#src, #small { display:none; }
.ttl { position:absolute; left:90px; top:96px; font:800 76px/1.02 var(--sans); letter-spacing:-0.035em; }
.ttl em { font-family:var(--serif); font-weight:400; color:var(--orange); }
.box { position:absolute; left:210px; top:700px; width:780px; height:104px; border-radius:30px;
  background:rgba(255,255,255,.07); border:1.5px solid rgba(255,255,255,.16);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  box-shadow:0 18px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.12); }
.q { position:absolute; left:40px; top:34px; font:500 30px/36px var(--sans); color:#f2f2f2; white-space:pre; }
.q.ph { color:#7c7c7c; }
.caret { display:inline-block; width:3px; height:32px; background:var(--orange); vertical-align:-6px; margin-left:2px; }
.send { position:absolute; right:22px; top:22px; width:60px; height:60px; border-radius:50%; background:var(--orange); }
.send::after { content:""; position:absolute; left:23px; top:19px; width:14px; height:14px; border:solid #111;
  border-width:4px 4px 0 0; transform:rotate(-45deg); }
.meta { position:absolute; top:40px; left:48px; font:600 15px var(--sans); letter-spacing:.14em; text-transform:uppercase; color:#8a8a8a; }
</style></head>
<body><div id="root" data-composition-id="ascii-drift" data-start="0" data-width="1200" data-height="900" data-duration="4">
  <canvas id="src" width="1200" height="900" data-layout-ignore></canvas>
  <canvas id="small" width="150" height="75" data-layout-ignore></canvas>
  <canvas id="glow" width="1200" height="900" data-layout-allow-overflow></canvas>
  <canvas id="cv" width="1200" height="900" data-layout-allow-overflow></canvas>
  <div class="meta" data-layout-ignore>Prompt · it listens</div>
  <div class="ttl" id="ttl">What should we<br><em>build</em> today?</div>
  <div class="box" id="box" data-layout-allow-overlap>
    <div class="q ph" id="ph">Ask for anything…</div>
    <div class="q" id="q"></div>
    <span class="send" id="send"></span>
  </div>
</div>
<script>
// Easing words (kit vocabulary): ease out = power2.out · glide = power2.inOut · lands = back.out(2)
const W = 1200, H = 900, CW = 8, CH = 12, COLS = W / CW, ROWS = H / CH, N = COLS * ROWS;
const GLYPHS = " '.:-~=+ot%sSX8#@";
const TYPE_AT = 1.3, PROMPT = "Design a landing page for my shop";
const TARGET = { x: 600, y: 700 };                                   // the glass box's top edge
const JELLY = [                                                      // start x, y (rim centre), bell radius, phase, colour 0 orange .. 1 fuchsia, depth 0 far .. 1 near
  { x: 520, y: 390, r: 40, ph: 0.8, c: 0.45, z: 0.35 },
  { x: 245, y: 600, r: 64, ph: 0.0, c: 0.0, z: 0.6 },
  { x: 830, y: 470, r: 180, ph: 0.45, c: 1.0, z: 1.0 },
];
const hash = (a, b) => { let h = (a * 374761393 + b * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const smooth = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
// one beat: fast contraction (0.3 of the cycle), slow relax; `rise` is how far the beats so far have pushed the bell up
const beatOf = (t, ph) => { const u = ((t / 1.25 + ph) % 1 + 1) % 1; return u < 0.3 ? smooth(u / 0.3) : 1 - smooth((u - 0.3) / 0.7); };
const riseOf = (t, ph) => { const n = t / 1.25 + ph, u = ((n % 1) + 1) % 1; return (Math.floor(n) + smooth(u / 0.3)) * 16; };
const ORANGE = [255, 106, 0], FUCHSIA = [230, 0, 126];
const mix = (a, b, f) => a.map((x, k) => Math.round(x + (b[k] - x) * f));
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

const src = document.getElementById("src"), sx = src.getContext("2d");
const small = document.getElementById("small"), smx = small.getContext("2d", { willReadFrequently: true });

function paintWater(t, pull) {
  sx.fillStyle = "#000"; sx.fillRect(0, 0, W, H);
  sx.globalCompositeOperation = "lighter";
  // light shafts slanting down from the surface
  for (let k = 0; k < 4; k++) {
    const x0 = 120 + k * 300 + Math.sin(t * 0.3 + k) * 30, g = sx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "rgba(90,110,140,0.09)"); g.addColorStop(0.7, "rgba(90,110,140,0)");
    sx.fillStyle = g; sx.beginPath();
    sx.moveTo(x0, 0); sx.lineTo(x0 + 70 + 20 * k, 0); sx.lineTo(x0 + 330, H); sx.lineTo(x0 + 230, H); sx.fill();
  }
  // marine snow: specks drifting up, parallax by depth
  for (let p = 0; p < 260; p++) {
    const z = hash(p, 3), x = hash(p, 1) * W + Math.sin(t * 0.7 + p) * 6 * z;
    const y = ((hash(p, 2) * (H + 40) - t * (8 + 22 * z)) % (H + 40) + H + 40) % (H + 40) - 20;
    sx.fillStyle = `rgba(170,190,215,${(0.25 + 0.55 * z) * (0.8 + 0.3 * pull)})`;
    sx.fillRect(x, y, 3 + 4 * z, 3 + 4 * z);
  }
}

function paintJelly(j, t, pull) {
  const beat = beatOf(t, j.ph), bright = (0.5 + 0.5 * j.z) * (0.8 + 0.45 * pull);
  const cx = j.x + (TARGET.x - j.x) * 0.24 * pull + Math.sin(t * 0.8 + j.ph * 6) * 12;
  const cy = j.y - riseOf(t, j.ph) * (0.6 + 0.4 * j.z) + (TARGET.y - 300 - j.y) * 0.12 * pull;
  const w = j.r * (1 - 0.16 * beat), h = j.r * (0.95 + 0.22 * beat);     // contracts narrow and tall
  const col = mix(ORANGE, FUCHSIA, j.c), hot = mix(col, [255, 255, 255], 0.55), warm = mix(col, [255, 236, 214], 0.7);
  const lw = j.r / 100;                                                   // line widths scale with size
  // tentacles first (behind the bell): fine strands from the margin; each beat sends a wave down them
  const NT = Math.max(7, Math.round(j.r / 10));
  for (let k = 0; k < NT; k++) {
    const a = (k + 0.5) / NT - 0.5, len = j.r * (2.1 + 0.9 * hash(k, j.r)), fq = 36 + 16 * hash(k, 7);
    let px = cx + a * 2 * w * 0.92, py = cy + h * 0.05;
    for (let s = 12; s <= len; s += 12) {
      const f = s / len, lag = s / 130;
      const spread = a * 2 * w * 0.92 * (1 + 0.3 * f * (1 - beatOf(t - lag, j.ph)));
      const nx = cx + spread + Math.sin(s / fq - t * 2.6 + k * 2.1 + j.ph * 5) * (3 + s * 0.17), ny = cy + h * 0.05 + s;
      sx.strokeStyle = rgba(col, (0.7 * (1 - f) ** 1.5 * bright).toFixed(3)); sx.lineWidth = Math.max(1.2, 3.2 * lw * (1 - 0.6 * f));
      sx.beginPath(); sx.moveTo(px, py); sx.lineTo(nx, ny); sx.stroke(); px = nx; py = ny;
    }
  }
  // oral arms: four ruffled ribbons from the centre, thick near the bell, curling as they trail
  for (let k = 0; k < 4; k++) {
    const len = j.r * (1.25 + 0.25 * (k % 2)), side = (k - 1.5) * 0.1 * w;
    let px = cx + side, py = cy - h * 0.1;
    for (let s = 8; s <= len; s += 8) {
      const f = s / len, nx = cx + side + Math.sin(s / 32 - t * 2.2 + k * 1.7 + j.ph * 4) * (4 + s * 0.15), ny = cy - h * 0.1 + s;
      sx.strokeStyle = rgba(warm, (0.55 * (1 - f) * bright * (0.7 + 0.3 * Math.sin(s * 0.3 + t * 3 + k))).toFixed(3));
      sx.lineWidth = (14 * (1 - f) + 3) * lw; sx.beginPath(); sx.moveTo(px, py); sx.lineTo(nx, ny); sx.stroke(); px = nx; py = ny;
    }
  }
  // the bell: a dome over a slightly concave margin
  const bell = () => { sx.beginPath(); sx.moveTo(cx - w, cy);
    sx.bezierCurveTo(cx - w, cy - h * 1.33, cx + w, cy - h * 1.33, cx + w, cy);
    sx.quadraticCurveTo(cx, cy - h * 0.22, cx - w, cy); sx.closePath(); };
  const g = sx.createRadialGradient(cx - w * 0.3, cy - h * 0.75, 0, cx, cy - h * 0.4, w * 1.15);
  g.addColorStop(0, rgba(hot, (0.55 * bright).toFixed(3))); g.addColorStop(0.45, rgba(col, (0.07 * bright).toFixed(3)));
  g.addColorStop(0.85, rgba(col, (0.2 * bright).toFixed(3))); g.addColorStop(1, rgba(hot, (0.75 * bright).toFixed(3)));
  bell(); sx.fillStyle = g; sx.fill();
  sx.save(); bell(); sx.clip();
  // radial canals from the apex to the rim, and four ring gonads seen through the bell
  sx.strokeStyle = rgba(hot, (0.26 * bright).toFixed(3)); sx.lineWidth = 2.2 * lw;
  for (let k = 0; k <= 12; k++) { const u = k / 12; sx.beginPath(); sx.moveTo(cx, cy - h);
    sx.quadraticCurveTo(cx + (u - 0.5) * 2 * w * 0.8, cy - h * 0.85, cx + (u - 0.5) * 2 * w, cy); sx.stroke(); }
  sx.strokeStyle = rgba(warm, (0.85 * bright).toFixed(3)); sx.lineWidth = 7 * lw;
  for (const [gx, gy] of [[-0.42, -0.38], [0.42, -0.38], [-0.15, -0.6], [0.15, -0.6]]) {
    sx.beginPath(); sx.ellipse(cx + gx * w, cy + gy * h, 0.17 * w, 0.12 * h, 0, 0.15 * Math.PI, 1.85 * Math.PI); sx.stroke(); }
  sx.restore();
  // a glowing rim and a scalloped margin
  bell(); sx.strokeStyle = rgba(hot, (0.95 * bright).toFixed(3)); sx.lineWidth = 5 * lw; sx.stroke();
  sx.fillStyle = rgba(hot, (0.8 * bright).toFixed(3));
  for (let k = 0; k <= 16; k++) { const u = k / 16, mx = cx - w + u * 2 * w, my = cy - h * 0.11 * (1 - (2 * u - 1) ** 2);
    sx.beginPath(); sx.arc(mx, my + 3 * lw, 4.5 * lw * (1 - 0.4 * beat), 0, Math.PI); sx.fill(); }
}

const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const gl = document.getElementById("glow"), gtx = gl.getContext("2d");
function draw(t) {
  const pull = smooth((t - TYPE_AT) / 2.2);                              // 0 before typing, 1 when the prompt is done
  sx.globalCompositeOperation = "source-over"; paintWater(t, pull);
  for (const j of JELLY) paintJelly(j, t, pull);                          // far to near
  sx.globalCompositeOperation = "source-over";
  smx.imageSmoothingEnabled = true; smx.imageSmoothingQuality = "high";
  smx.clearRect(0, 0, COLS, ROWS); smx.drawImage(src, 0, 0, COLS, ROWS);
  const px = smx.getImageData(0, 0, COLS, ROWS).data;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = "rgba(140,140,170,0.07)";
  for (let r = 0; r < ROWS; r += 2) for (let c = 0; c < COLS; c += 2) ctx.fillRect(c * CW + 3, r * CH + 5, 1, 1);
  ctx.font = "700 10px Consolas, 'JetBrains Mono', monospace"; ctx.textBaseline = "middle"; ctx.textAlign = "center";
  const fr = Math.floor(t * 8);
  for (let i = 0; i < N; i++) {
    const R = px[i * 4], G = px[i * 4 + 1], B = px[i * 4 + 2], m = Math.max(R, G, B);
    const v = Math.pow(m / 255, 0.8); if (v < 0.13) continue;
    const c = i % COLS, r = (i / COLS) | 0, x = c * CW, y = r * CH;
    const col = [R, G, B].map((q) => Math.round(q / m * 255 * (0.45 + 0.55 * v)));   // the cell's hue at a readable level
    const inv = v > 0.8 && hash(c, r) > 0.3;
    ctx.fillStyle = inv ? rgba(col, 0.9) : rgba(col, (0.03 + 0.2 * v).toFixed(3)); ctx.fillRect(x + 1, y + 1, CW - 2, CH - 2);
    const gv = clamp(v + (hash(c * 3 + fr, r) - 0.5) * 0.14);
    const ch = GLYPHS[Math.max(1, Math.min(GLYPHS.length - 1, Math.round(gv * (GLYPHS.length - 1))))];
    const accent = v < 0.35 && hash(c + 777, r + fr) > 0.996;
    ctx.fillStyle = inv ? "#07080b" : accent ? "#ffb000" : rgba(col, clamp(0.35 + v).toFixed(3));
    ctx.fillText(ch, x + CW / 2, y + CH / 2 + 1);
  }
  gtx.clearRect(0, 0, W, H);
  gtx.filter = "blur(10px)"; gtx.globalAlpha = 0.5 + 0.25 * pull; gtx.drawImage(cv, 0, 0); gtx.filter = "none"; gtx.globalAlpha = 1;
}
gsap.set("#ttl", { opacity: 0, y: 14 });
gsap.set("#box", { opacity: 0, y: 24 });
const clock = { t: 0 };
draw(0);
const tl = gsap.timeline({ paused: true });
tl.to(clock, { t: 4, duration: 4, ease: "none", onUpdate: () => draw(clock.t) }, 0)
  .to("#ttl", { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.2)
  .to("#box", { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.55);
tl.set("#ph", { opacity: 0 }, TYPE_AT);
for (let i = 1; i <= PROMPT.length; i++) {
  tl.set("#q", { innerHTML: PROMPT.slice(0, i) + '<i class="caret"></i>' }, Number((TYPE_AT + i * 0.05).toFixed(3)));
}
const sent = TYPE_AT + PROMPT.length * 0.05 + 0.25;
tl.to("#send", { scale: 0.86, duration: 0.1, ease: "power2.out" }, sent)
  .to("#send", { scale: 1, duration: 0.3, ease: "back.out(3)" }, sent + 0.1)
  .to({}, { duration: 0.01 }, 3.99);
window.__timelines = window.__timelines || {};
window.__timelines["ascii-drift"] = tl;
</script>
<script src="../kit-preview.js"></script>
</body></html>
