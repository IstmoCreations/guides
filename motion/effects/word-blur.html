<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><title>Word Blur</title>
<link rel="stylesheet" href="../kit.css">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
/* A headline whose second line cycles through three tasks. Each word arrives out of a blur, rising a little,
   one after another; the line leaves the same way before the next one comes in. The last one holds. */
.lead { position:absolute; left:110px; top:250px; font:800 104px/1 var(--sans); letter-spacing:-0.04em; color:var(--ink); }
.slot { position:absolute; left:110px; top:380px; width:1000px; height:140px; }
.ph { position:absolute; left:0; top:0; white-space:nowrap; font:400 112px/1.1 var(--serif); font-style:italic;
  letter-spacing:-0.02em; color:var(--orange-text); }
.ph span { display:inline-block; margin-right:.22em; }
.dots { position:absolute; left:114px; top:600px; display:flex; gap:14px; }
.dots i { width:14px; height:14px; border-radius:50%; background:var(--line); }
.sub { position:absolute; left:110px; top:660px; font:500 30px var(--sans); color:var(--ink-soft); }
.meta { position:absolute; top:40px; left:48px; font:600 15px var(--sans); letter-spacing:.14em; text-transform:uppercase; color:#8a8a8a; }
</style></head>
<body><div id="root" class="grid-paper" data-composition-id="word-blur" data-start="0" data-width="1200" data-height="900" data-duration="4">
  <div class="meta" data-layout-ignore>Headline · cycles</div>
  <div class="lead" id="lead">Today, build</div>
  <div class="slot">
    <div class="ph" id="p0" data-layout-allow-overlap><span>a</span><span>landing</span><span>page.</span></div>
    <div class="ph" id="p1" data-layout-allow-overlap><span>a</span><span>booking</span><span>form.</span></div>
    <div class="ph" id="p2" data-layout-allow-overlap><span>your</span><span>price</span><span>menu.</span></div>
  </div>
  <div class="dots"><i id="d0"></i><i id="d1"></i><i id="d2"></i></div>
  <div class="sub" id="sub">One prompt at a time.</div>
</div>
<script>
// Easing words (kit vocabulary): ease out = power2.out · glide = power2.inOut · lands = back.out(2)
const PH = ["#p0", "#p1", "#p2"], IN = [0.35, 1.5, 2.65];
gsap.set(".ph span", { opacity: 0, y: 22, filter: "blur(14px)" });
gsap.set("#lead, #sub", { opacity: 0, y: 14 });
const tl = gsap.timeline({ paused: true });
tl.to("#lead", { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 0.05);
PH.forEach((p, k) => {
  const words = `${p} span`, at = IN[k];
  tl.to(words, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.42, stagger: 0.09, ease: "power2.out" }, at)
    .to(`#d${k}`, { backgroundColor: "#ff6a00", scale: 1.25, duration: 0.25, ease: "back.out(2)" }, at);
  if (k > 0) tl.to(`#d${k - 1}`, { backgroundColor: "#d4d4d0", scale: 1, duration: 0.2, ease: "power2.out" }, at);
  if (k < PH.length - 1) tl.to(words, { opacity: 0, y: -16, filter: "blur(12px)", duration: 0.3, stagger: 0.06, ease: "power2.inOut" }, IN[k + 1] - 0.36);
});
tl.to("#sub", { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 3.1)
  .to({}, { duration: 0.01 }, 3.99);
window.__timelines = window.__timelines || {};
window.__timelines["word-blur"] = tl;
</script>
<script src="../kit-preview.js"></script>
</body></html>
