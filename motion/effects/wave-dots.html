<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><title>Wave Dots</title>
<link rel="stylesheet" href="../kit.css">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
/* A field of dots in perspective; each dot bobs on its own finite yoyo, delayed by its column, so a swell travels
   across the field. Far rows are smaller, dimmer and move less. No timers, no random. */
#root { background:#111111; color:#fff; }
#field i { position:absolute; border-radius:50%; background:#fff; }
#field i.o { background:var(--orange); }
.ttl { position:absolute; left:90px; top:110px; font:800 84px/1 var(--sans); letter-spacing:-0.035em; }
.ttl em { font-family:var(--serif); font-weight:400; color:var(--orange); }
.lab { position:absolute; left:94px; top:215px; font:600 22px var(--sans); letter-spacing:.12em; text-transform:uppercase; color:#9a9a9a; }
.meta { position:absolute; top:40px; left:48px; font:600 15px var(--sans); letter-spacing:.14em; text-transform:uppercase; color:#8a8a8a; }
</style></head>
<body><div id="root" data-composition-id="wave-dots" data-start="0" data-width="1200" data-height="900" data-duration="4">
  <div class="meta" data-layout-ignore>Swell · demo data</div>
  <div class="ttl" id="ttl">Read the <em>swell.</em></div>
  <div class="lab" id="lab">1.4 m · 12 s period · from the south-west</div>
  <div id="field"></div>
</div>
<script>
// Easing words (kit vocabulary): ease out = power2.out · glide = power2.inOut · lands = back.out(2) · sine for the swell
const COLS = 30, ROWS = 12, field = document.getElementById("field");
const dots = [];
for (let r = 0; r < ROWS; r++) {
  const depth = r / (ROWS - 1);                    // 0 far .. 1 near
  const y = 360 + Math.pow(depth, 1.6) * 470;     // rows spread out toward the viewer
  const span = 700 + depth * 640;                 // near rows are wider
  const size = 4 + depth * 12;
  for (let c = 0; c < COLS; c++) {
    const x = 600 - span / 2 + (c / (COLS - 1)) * span;
    const el = document.createElement("i");
    if (r === ROWS - 3 && c % 6 === 2) el.className = "o";
    el.style.cssText = `left:${(x - size / 2).toFixed(1)}px;top:${(y - size / 2).toFixed(1)}px;width:${size.toFixed(1)}px;height:${size.toFixed(1)}px;opacity:${(0.25 + depth * 0.75).toFixed(2)}`;
    field.appendChild(el);
    dots.push({ el, r, c, depth });
  }
}
gsap.set("#field", { opacity: 0 });
gsap.set("#ttl, #lab", { opacity: 0, y: 14 });
const tl = gsap.timeline({ paused: true });
tl.to("#field", { opacity: 1, duration: 0.4, ease: "power2.out" }, 0)
  .to("#ttl", { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 0.15)
  .to("#lab", { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 0.3);
for (const d of dots) {
  const amp = 8 + d.depth * 46;
  tl.to(d.el, { y: -amp, duration: 0.6, yoyo: true, repeat: 4, ease: "sine.inOut" }, 0.05 + d.c * 0.03 + (1 - d.depth) * 0.12);
}
tl.to({}, { duration: 0.01 }, 3.99);
window.__timelines = window.__timelines || {};
window.__timelines["wave-dots"] = tl;
</script>
<script src="../kit-preview.js"></script>
</body></html>
