<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><title>Donut Ring</title>
<link rel="stylesheet" href="../kit.css">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
#root { background:#111111; color:#fff; }
svg { position:absolute; left:110px; top:170px; width:560px; height:560px; }
.seg { fill:none; stroke-width:62; }
.track { fill:none; stroke:#262626; stroke-width:62; }
.mid { position:absolute; left:110px; top:170px; width:560px; height:560px; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.mid b { font:800 140px/1 var(--sans); letter-spacing:-0.04em; font-variant-numeric:tabular-nums; }
.mid span { margin-top:8px; font:600 26px var(--sans); color:#b0b0b0; }
.ttl { position:absolute; left:760px; top:250px; font:800 44px/1.1 var(--sans); letter-spacing:-0.02em; width:360px; }
.ttl em { font-family:var(--serif); font-weight:400; color:var(--orange); }
.row { position:absolute; left:760px; display:flex; align-items:center; gap:16px; font:600 30px var(--sans); width:340px; }
.row i { width:22px; height:22px; border-radius:6px; }
.row b { margin-left:auto; font-weight:800; font-variant-numeric:tabular-nums; }
.meta { position:absolute; top:40px; left:48px; font:600 15px var(--sans); letter-spacing:.14em; text-transform:uppercase; color:#8a8a8a; }
</style></head>
<body><div id="root" data-composition-id="donut-ring" data-start="0" data-width="1200" data-height="900" data-duration="4">
  <div class="meta" data-layout-ignore>Demo data · ola negra</div>
  <svg viewBox="0 0 560 560">
    <g transform="rotate(-90 280 280)">
      <circle class="track" cx="280" cy="280" r="220" pathLength="100"/>
      <circle class="seg" id="s1" cx="280" cy="280" r="220" pathLength="100" stroke="#ff6a00"/>
      <circle class="seg" id="s2" cx="280" cy="280" r="220" pathLength="100" stroke="#ffffff"/>
      <circle class="seg" id="s3" cx="280" cy="280" r="220" pathLength="100" stroke="#6e6e6e"/>
    </g>
  </svg>
  <div class="mid"><b id="pct">0 %</b><span>direct</span></div>
  <div class="ttl" id="ttl">Where bookings <em>come from</em></div>
  <div class="row" id="r1" style="top:440px"><i style="background:#ff6a00"></i>Direct<b>48 %</b></div>
  <div class="row" id="r2" style="top:500px"><i style="background:#fff"></i>Instagram<b>32 %</b></div>
  <div class="row" id="r3" style="top:560px"><i style="background:#6e6e6e"></i>Referral<b>20 %</b></div>
</div>
<script>
// Easing words (kit vocabulary): ease out = power2.out · glide = power2.inOut · lands = back.out(2)
// Each segment is the same circle with pathLength=100: dasharray "share gap", dashoffset = -(shares before it).
// The dash attributes are tweened as ATTRIBUTES (a CSS stroke-dash tween snaps at the halfway point).
const SEG = [["#s1", 48, 0], ["#s2", 32, 48], ["#s3", 20, 80]];
SEG.forEach(([id, , off]) => gsap.set(id, { attr: { "stroke-dasharray": "0 100", "stroke-dashoffset": -off } }));
gsap.set(".row, #ttl", { opacity: 0, x: -14 });
const tl = gsap.timeline({ paused: true });
tl.to("#ttl", { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" }, 0.05);
let t = 0.25;
SEG.forEach(([id, share], k) => {
  const d = 0.25 + share / 100;
  tl.to(id, { attr: { "stroke-dasharray": `${share} ${100 - share}` }, duration: d, ease: "power2.inOut" }, t)
    .to(`#r${k + 1}`, { opacity: 1, x: 0, duration: 0.25, ease: "power2.out" }, t + d - 0.15);
  t += d - 0.05;
});
// the centre counts to the first share in whole steps, one tl.set per step
for (let p = 1; p <= 48; p++) tl.set("#pct", { innerText: `${p} %` }, Number((0.25 + (p / 48) * 0.73).toFixed(3)));
tl.to({}, { duration: 0.01 }, 3.99);
window.__timelines = window.__timelines || {};
window.__timelines["donut-ring"] = tl;
</script>
<script src="../kit-preview.js"></script>
</body></html>
