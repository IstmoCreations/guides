<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><title>ASCII Swell</title>
<link rel="stylesheet" href="../kit.css">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
/* A six-person outrigger canoe (OC6) crossing a calm Panamá bay at dawn, drawn entirely in text characters: islands
   on the horizon, the low sun's path on the water, the ama on the near side, the crew in one stroke, a V wake and
   the canoe's reflection. Form and motion referenced from a supplied phone video (2026-11-17); no footage used.
   The ASCII ENGINE (detail level studied from the public preview of HorizonX's Kurage Dashboard; no code or subject
   taken): every lit cell is a TILE with a glyph inside, the brightest cells INVERT, glyphs are a mixed set picked by
   brightness plus a per-cell hash, shapes are SHADED, far things fade, a GLOW pass sits underneath, a rare accent
   glyph, a faint dotted grid. Pure function of timeline time: no timers, no Math.random. */
#root { background:#06090c; color:#fff; }
canvas { position:absolute; inset:0; }
.meta { position:absolute; top:40px; left:48px; font:600 15px var(--sans); letter-spacing:.14em; text-transform:uppercase; color:#8b98a0; }
.cap { position:absolute; left:90px; top:96px; font:800 64px/1.02 var(--sans); letter-spacing:-0.035em; }
.cap em { font-family:var(--serif); font-weight:400; color:var(--orange); }
</style></head>
<body><div id="root" data-composition-id="ascii-swell" data-start="0" data-width="1200" data-height="900" data-duration="4">
  <canvas id="glow" width="1200" height="900"></canvas>
  <canvas id="cv" width="1200" height="900"></canvas>
  <div class="meta" data-layout-ignore>ASCII · dawn crossing</div>
  <div class="cap" id="cap">Six paddles,<br><em>one stroke.</em></div>
</div>
<script>
// Easing words (kit vocabulary): ease out = power2.out · glide = power2.inOut · lands = back.out(2)
const W = 1200, H = 900, CW = 10, CH = 14, COLS = W / CW, ROWS = Math.ceil(H / CH), N = COLS * ROWS;
const val = new Float32Array(N), kind = new Uint8Array(N);
// materials: 0 water, 1 foam/wake, 2 sun, 3 hull, 4 crew skin, 5 sky, 6 island, 7 stripe, 8 jersey, 9 reflection
const GLYPHS = " '.:-~ot%sSX8#@";
const hash = (a, b) => { let h = (a * 374761393 + b * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const put = (i, v, k) => { if (v > val[i]) { val[i] = v; kind[i] = k; } };
const cell = (px, py) => { const c = Math.floor(px / CW), r = Math.floor(py / CH); return c < 0 || r < 0 || c >= COLS || r >= ROWS ? -1 : r * COLS + c; };

// ---------- sky, islands, calm water ----------
const HORIZON = 360, SUN_X = 190;
const isle = (x) => Math.max(0,                                     // island silhouettes: height in px above the horizon
  46 * Math.exp(-Math.pow((x - 1090) / 70, 2)), 30 * Math.exp(-Math.pow((x - 960) / 45, 2)),
  20 * Math.exp(-Math.pow((x - 700) / 90, 2)), 12 * Math.exp(-Math.pow((x - 560) / 40, 2)), 9 * Math.exp(-Math.pow((x - 380) / 60, 2)));
const ripple = (x, z, t) => 0.5 * Math.sin(0.03 * z + 0.004 * x - 1.7 * t) + 0.3 * Math.sin(0.071 * z - 0.011 * x - 2.6 * t + 1.1) + 0.2 * Math.sin(0.15 * z + 0.02 * x - 3.4 * t + 2.3);
function world(t) {
  for (let r = 0; r < ROWS; r++) {
    const sy = r * CH + CH / 2;
    for (let c = 0; c < COLS; c++) {
      const sx = c * CW + CW / 2, i = r * COLS + c;
      if (sy < HORIZON) {
        // dawn sky: a warm band over the horizon, brightest around the sun, sparse higher up
        const up = (HORIZON - sy) / 360, warm = Math.exp(-Math.pow((sx - SUN_X) / 260, 2));
        const v = (0.03 + 0.26 * Math.exp(-up * 6) + 0.34 * warm * Math.exp(-up * 4)) * (hash(c, r) > 0.62 + 0.3 * up ? 1 : 0);
        const disk = Math.hypot(sx - SUN_X, sy - (HORIZON - 34)) < 30;
        if (HORIZON - sy < isle(sx)) put(i, 0.34 + 0.1 * hash(c, r), 6); else if (disk) put(i, 0.95, 2); else if (v > 0.07) put(i, v, 5);
        continue;
      }
      const z = 60000 / (sy - HORIZON + 6), fog = clamp(1 - z / 3000);
      const x = (sx - W / 2) * z / 700, h = ripple(x, z, t);
      const v = (0.04 + 0.3 * Math.pow(clamp(0.5 + 0.5 * h), 4)) * (0.4 + 0.6 * fog);
      put(i, v, 0);
      // the sun's path: a narrow column that widens toward the viewer, broken by the ripples
      const sun = Math.exp(-Math.pow((sx - SUN_X) / (8 + 34 * clamp((sy - HORIZON) / 540)), 2)) * clamp(0.2 + h);
      if (sun > 0.25 && hash(c, r * 5 + Math.floor(t * 9)) > 0.58) put(i, 0.25 + 0.7 * sun, 2);
    }
  }
}

// ---------- the canoe ----------
const capsule = (px, py, ax, ay, bx, by, r) => {
  const pax = px - ax, pay = py - ay, bax = bx - ax, bay = by - ay;
  const h = clamp((pax * bax + pay * bay) / (bax * bax + bay * bay));
  return Math.hypot(pax - bax * h, pay - bay * h) - r;
};
function canoe(t) {
  const bob = Math.sin(t * 1.4) * 3, cx = 560 + t * 22, wl = 590 + bob;  // waterline under the hull, gliding right
  const L = 1060, ax = cx - L / 2, bx = cx + L / 2;
  const stroke = (t / 1.1) % 1, reach = Math.sin(stroke * Math.PI * 2);
  const parts = [];
  // hull: low and long, bow (right) rising slightly; white with an orange stripe along its side
  const hullTop = (px) => wl - 30 - Math.max(0, (px - (bx - 140)) / 140) * 14;
  parts.push((px, py) => { const along = clamp((px - ax) / L), rad = 18 * Math.pow(Math.sin(Math.PI * clamp(along * 0.98 + 0.01)), 0.5) + 2;
    const d = capsule(px, py, ax, wl - 12, bx, wl - 22, rad);
    const stripe = Math.abs(py - (wl - 13)) < 4;
    return { d, k: stripe ? 7 : 3, shade: stripe ? 0.85 : clamp(0.5 + 0.5 * Math.exp(-Math.pow((py - hullTop(px)) / 8, 2))) }; });
  // ama on the near side: lower on screen (closer), joined by two curved arms (iato)
  const amaY = wl + 62 + bob * 0.6;
  parts.push((px, py) => ({ d: capsule(px, py, cx - 330, amaY + 4, cx + 170, amaY - 6, 11), k: 3, shade: clamp(0.55 + (amaY - py) / 30) }));
  for (const ox of [-250, 70]) parts.push((px, py) => {
    const d1 = capsule(px, py, cx + ox, wl - 34, cx + ox - 6, wl + 10, 4), d2 = capsule(px, py, cx + ox - 6, wl + 10, cx + ox - 26, amaY - 4, 4);
    return { d: Math.min(d1, d2), k: 3, shade: 0.62 }; });
  // six paddlers: seats 1-6 from bow to stern, all in one stroke; odd seats paddle on the far side (dimmer blade)
  for (let s = 0; s < 6; s++) {
    const sx = bx - 200 - s * 150, base = wl - 30, lean = 12 * reach, hx = sx + lean, hy = base - 70;
    const far = s % 2 === 0;
    parts.push((px, py) => ({ d: Math.hypot(px - hx, py - hy) - 14, k: 4, shade: clamp(0.8 + (hy - py) / 30) }));
    parts.push((px, py) => ({ d: capsule(px, py, sx - 2, base, hx - 1, hy + 22, 16), k: 8, shade: clamp(0.55 + (hx + 12 - px) / 60) }));
    // paddle: top hand above the head, blade forward at the catch, swept back past the hip at the exit
    const gx = hx + 14, gy = hy - 10, tipX = sx + 120 * reach + 30, tipY = wl + 20 - 22 * Math.max(0, -reach);
    parts.push((px, py) => ({ d: capsule(px, py, gx, gy, tipX, tipY, 3.5), k: 4, shade: far ? 0.45 : 0.7 }));
    const len = Math.hypot(tipX - gx, tipY - gy), ux = (tipX - gx) / len, uy = (tipY - gy) / len;
    parts.push((px, py) => ({ d: capsule(px, py, tipX - ux * 30, tipY - uy * 30, tipX, tipY, 8), k: 4, shade: far ? 0.5 : 0.9 }));
    // the catch: a small splash where the blade enters
    if (reach > 0.7) for (let q = 0; q < 6; q++) { const i = cell(tipX - 10 + q * 5, wl + 4 - (q % 3) * 6); if (i >= 0) put(i, 0.6 + 0.3 * (reach - 0.7) * 3, 1); }
  }
  // rasterise the canoe, and its reflection (mirrored at the waterline, dim, wobbling with the ripples)
  const c0 = Math.max(0, Math.floor((ax - 20) / CW)), c1 = Math.min(COLS - 1, Math.ceil((bx + 20) / CW));
  const r0 = Math.max(0, Math.floor((wl - 120) / CH)), r1 = Math.min(ROWS - 1, Math.ceil((amaY + 30) / CH));
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
    const px = c * CW + CW / 2, py = r * CH + CH / 2;
    let best = null; for (const f of parts) { const p = f(px, py); if (!best || p.d < best.d) best = p; }
    if (best.d < 3.5) { const i = r * COLS + c; val[i] = 0; put(i, clamp(best.shade + 0.08 * hash(c, r)), best.k); }
  }
  for (let r = Math.ceil(wl / CH); r <= Math.min(ROWS - 1, Math.ceil((wl + 110) / CH)); r++) for (let c = c0; c <= c1; c++) {
    const py = r * CH + CH / 2, my = 2 * wl - py - 6, px = c * CW + CW / 2 + 4 * Math.sin(py * 0.15 + t * 4);
    if (my > wl - 2) continue;
    let best = null; for (const f of parts) { const p = f(px, my); if (!best || p.d < best.d) best = p; }
    const i = r * COLS + c;
    if (best.d < 1.5 && hash(c, r + Math.floor(t * 6)) > 0.25 && val[i] < 0.5) put(i, 0.16 + 0.12 * best.shade, 9);
  }
  // V wake spreading back from the stern
  for (let q = 0; q < 70; q++) {
    const wx = ax + 20 - q * 8, spread = q * 1.7;
    for (const sgn of [-1, 1]) { const i = cell(wx, wl + 2 + sgn * spread * 0.32 + (sgn > 0 ? spread * 0.25 : 0)); if (i >= 0) put(i, 0.62 - q / 140, 1); }
  }
}

// ---------- draw: tiles + glyphs, then the glow pass ----------
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const gl = document.getElementById("glow"), gtx = gl.getContext("2d");
const COLOR = [
  [[18, 62, 78], [110, 190, 205]],     // 0 water
  [[160, 205, 215], [240, 252, 255]],  // 1 foam / wake / splash
  [[255, 106, 0], [255, 220, 170]],    // 2 sun path: our orange to warm white
  [[175, 185, 192], [255, 255, 255]],  // 3 hull + ama: white
  [[200, 160, 130], [255, 230, 210]],  // 4 skin + paddles
  [[90, 70, 110], [255, 190, 150]],    // 5 dawn sky: dusk violet to peach
  [[28, 58, 66], [74, 112, 122]],      // 6 islands: dark teal silhouettes
  [[255, 106, 0], [255, 150, 70]],     // 7 hull stripe: orange
  [[230, 0, 126], [255, 120, 190]],    // 8 jerseys: fuchsia
  [[60, 120, 140], [150, 200, 210]],   // 9 reflection
];
const mix = (a, b, f) => a.map((x, j) => Math.round(x + (b[j] - x) * f));
function draw(t) {
  val.fill(0); kind.fill(0);
  world(t); canoe(t);
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = "rgba(120,150,160,0.09)";
  for (let r = 0; r < ROWS; r += 2) for (let c = 0; c < COLS; c += 2) ctx.fillRect(c * CW + 4, r * CH + 6, 1, 1);
  ctx.font = "700 11px Consolas, 'JetBrains Mono', monospace"; ctx.textBaseline = "middle"; ctx.textAlign = "center";
  const fr = Math.floor(t * 8);
  for (let i = 0; i < N; i++) {
    const v = val[i]; if (v < 0.06) continue;
    const c = i % COLS, r = (i / COLS) | 0, k = kind[i];
    const [lo, hi] = COLOR[k], col = mix(lo, hi, clamp(v)), x = c * CW, y = r * CH;
    const inv = v > 0.88 && hash(c, r) > 0.4;
    ctx.fillStyle = inv ? `rgba(${col},0.88)` : `rgba(${col},${(0.05 + 0.26 * v).toFixed(3)})`;
    ctx.fillRect(x + 1, y + 1, CW - 2, CH - 2);
    const g = clamp(v + (hash(c * 3 + fr, r) - 0.5) * 0.16);
    const ch = GLYPHS[Math.max(1, Math.min(GLYPHS.length - 1, Math.round(g * (GLYPHS.length - 1))))];
    const accent = k === 0 && hash(c + 999, r + fr) > 0.9985;
    ctx.fillStyle = inv ? "#06090c" : accent ? "#ffb000" : `rgba(${col},${clamp(0.35 + v).toFixed(3)})`;
    ctx.fillText(ch, x + CW / 2, y + CH / 2 + 1);
  }
  gtx.clearRect(0, 0, W, H);
  gtx.filter = "blur(10px)"; gtx.globalAlpha = 0.55; gtx.drawImage(cv, 0, 0); gtx.filter = "none"; gtx.globalAlpha = 1;
}
gsap.set("#cap", { opacity: 0, y: 14 });
const clock = { t: 0 };
draw(0);
const tl = gsap.timeline({ paused: true });
tl.to(clock, { t: 4, duration: 4, ease: "none", onUpdate: () => draw(clock.t) }, 0)
  .to("#cap", { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.3)
  .to({}, { duration: 0.01 }, 3.99);
window.__timelines = window.__timelines || {};
window.__timelines["ascii-swell"] = tl;
</script>
<script src="../kit-preview.js"></script>
</body></html>
