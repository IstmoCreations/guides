<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><title>Chat Thread</title>
<link rel="stylesheet" href="../kit.css">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
/* A booking conversation for a DEMO brand: bubbles land one by one, a typing indicator comes before each reply,
   and the thread ends on a confirmation card. */
.win { position:absolute; left:260px; top:70px; width:680px; height:760px; border-radius:36px; background:#fff; border:2px solid var(--line);
       box-shadow:0 40px 70px -46px #00000066; overflow:hidden; }
.top { position:absolute; left:0; right:0; top:0; height:96px; display:flex; align-items:center; gap:16px; padding:0 32px; border-bottom:1px solid var(--line); }
.top i { width:50px; height:50px; border-radius:50%; background:var(--orange); }
.top b { font:800 28px var(--sans); } .top span { font:600 20px var(--sans); color:var(--ink-soft); display:block; }
.b { position:absolute; max-width:440px; padding:20px 26px; border-radius:28px; font:600 28px/1.3 var(--sans); }
.in { left:32px; background:var(--panel); color:var(--ink); border-bottom-left-radius:8px; }
.out { right:32px; background:var(--ink); color:#fff; border-bottom-right-radius:8px; }
.typing { position:absolute; right:32px; display:flex; gap:8px; padding:22px 26px; border-radius:28px; background:var(--ink); border-bottom-right-radius:8px; }
.typing i { width:12px; height:12px; border-radius:50%; background:#8a8a8a; }
.ok { position:absolute; left:32px; right:32px; top:636px; display:flex; align-items:center; gap:16px; padding:20px 24px; border-radius:22px; border:2px solid var(--orange); background:#fff7f0; }
.ok em { width:44px; height:44px; border-radius:50%; background:var(--orange); position:relative; flex:none; }
.ok em::after { content:""; position:absolute; left:15px; top:8px; width:10px; height:20px; border:solid var(--ink); border-width:0 4px 4px 0; transform:rotate(45deg); }
.ok b { font:800 26px var(--sans); } .ok span { display:block; font:600 22px var(--sans); color:var(--ink-soft); }
.meta { position:absolute; top:40px; left:48px; font:600 15px var(--sans); letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft); }
</style></head>
<body><div id="root" class="grid-paper" data-composition-id="chat-thread" data-start="0" data-width="1200" data-height="900" data-duration="4">
  <div class="meta" data-layout-ignore>Demo chat · ola negra</div>
  <div class="win">
    <div class="top"><i></i><div><b>ola negra</b><span>Usually replies in minutes</span></div></div>
    <div class="b in" id="m1" style="top:130px">Space for 4 this Saturday?</div>
    <div class="typing" id="t1" style="top:236px" data-layout-allow-overlap><i></i><i></i><i></i></div>
    <div class="b out" id="m2" style="top:236px">Yes! 8:00 or 10:30?</div>
    <div class="b in" id="m3" style="top:342px">8:00, please.</div>
    <div class="typing" id="t2" style="top:448px" data-layout-allow-overlap><i></i><i></i><i></i></div>
    <div class="b out" id="m4" style="top:448px">Booked. See you on the water.</div>
    <div class="ok" id="ok"><em></em><div><b>Booking confirmed</b><span>Sat · 8:00 · 4 people</span></div></div>
  </div>
</div>
<script>
// Easing words (kit vocabulary): ease out = power2.out · glide = power2.inOut · lands = back.out(2)
gsap.set(".b, .typing, .ok", { opacity: 0 });
const tl = gsap.timeline({ paused: true });
const pop = (sel, at, from) => tl.fromTo(sel, { opacity: 0, y: 18, scale: 0.9, transformOrigin: from },
  { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false }, at);
const typing = (sel, at, until) => {
  tl.to(sel, { opacity: 1, duration: 0.1 }, at)
    .to(`${sel} i`, { y: -8, duration: 0.14, stagger: 0.07, yoyo: true, repeat: 1, ease: "power2.inOut" }, at + 0.05)
    .to(sel, { opacity: 0, duration: 0.06 }, until);
};
tl.from(".win", { opacity: 0, y: 24, duration: 0.3, ease: "power2.out" }, 0);
pop("#m1", 0.25, "0% 100%");
typing("#t1", 0.6, 0.98);
pop("#m2", 1.0, "100% 100%");
pop("#m3", 1.35, "0% 100%");
typing("#t2", 1.65, 2.03);
pop("#m4", 2.05, "100% 100%");
tl.fromTo("#ok", { opacity: 0, scaleX: 0.6, scaleY: 0.6 }, { opacity: 1, scaleX: 1.06, scaleY: 0.94, duration: 0.14, ease: "power2.out", immediateRender: false }, 2.45)
  .to("#ok", { scaleX: 1, scaleY: 1, duration: 0.3, ease: "back.out(3)" }, 2.59)
  .to({}, { duration: 0.01 }, 3.99);
window.__timelines = window.__timelines || {};
window.__timelines["chat-thread"] = tl;
</script>
<script src="../kit-preview.js"></script>
</body></html>
