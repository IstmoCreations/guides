<!doctype html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Istmo Creations guides</title>
<script>
  (function () {
    var l;
    try { l = localStorage.getItem('lang'); } catch (e) {}
    if (l !== 'en' && l !== 'es') l = /^es\b/i.test(navigator.language || '') ? 'es' : 'en';
    document.documentElement.setAttribute('data-lang', l);
    document.documentElement.setAttribute('lang', l);
  })();
</script>
<style>
  :root { --bg: #fbfaf7; --fg: #1c1b19; --muted: #6b675f; --line: #e4e0d8; --accent: #0f7a6c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141412; --fg: #ecebe6; --muted: #a29e95; --line: #2c2b28; --accent: #4cc3b0; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 20px 16px 32px; }
  html[data-lang="en"] [data-l="es"], html[data-lang="es"] [data-l="en"] { display: none; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 28px; }
  .brand img { height: 44px; width: auto; display: block; }
  .logo-dark-bg { display: none !important; }
  @media (prefers-color-scheme: dark) { .logo-dark-bg { display: block !important; } .logo-light-bg { display: none !important; } }
  .switch { display: flex; gap: 4px; }
  .switch button { font: inherit; font-size: 0.85rem; padding: 4px 12px; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 999px; cursor: pointer; }
  html[data-lang="en"] .switch [data-set="en"], html[data-lang="es"] .switch [data-set="es"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  a { color: var(--accent); }
  p { color: var(--muted); }
</style>
</head>
<body>
<main>
  <header class="top">
    <a href="./" class="brand" aria-label="Istmo Creations guides">
      <img class="logo-dark-bg" src="logo-light.svg" alt="Istmo Creations">
      <img class="logo-light-bg" src="logo.svg" alt="Istmo Creations">
    </a>
    <div class="switch" role="group" aria-label="Language / Idioma">
      <button type="button" data-set="en">English</button>
      <button type="button" data-set="es">Español</button>
    </div>
  </header>
  <div data-l="en">
    <h1>Istmo Creations guides</h1>
    <p>Setup guides for the tools shown in our reels.</p>
    <ul><li><a href="floorplan/">Map your app with Floorplan</a></li></ul>
  </div>
  <div data-l="es">
    <h1>Guías de Istmo Creations</h1>
    <p>Guías para instalar las herramientas que mostramos en nuestros reels.</p>
    <ul><li><a href="floorplan/">Haz un mapa de tu app con Floorplan</a></li></ul>
  </div>
</main>
<script>
  document.querySelectorAll('.switch [data-set]').forEach(function (b) {
    b.addEventListener('click', function () {
      var l = b.getAttribute('data-set');
      document.documentElement.setAttribute('data-lang', l);
      document.documentElement.setAttribute('lang', l);
      try { localStorage.setItem('lang', l); } catch (e) {}
    });
  });
</script>
</body>
</html>
